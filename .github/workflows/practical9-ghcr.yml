
name: Practical 9 - Docker Image Versioning

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t student-result-ml:practical9 .

      - name: Test Docker image
        run: |
          docker run -d --name practical9-test \
            -p 5000:5000 student-result-ml:practical9

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready"
              break
            fi
            sleep 2
          done

          curl --fail --show-error http://localhost:5000/

          curl --fail --show-error \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":85,"internal_marks":80,"assignment_marks":90,"previous_score":75}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create commit-based image tag
        run: |
          docker tag student-result-ml:practical9 \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

      - name: Push versioned image to GHCR
        run: |
          docker push \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

      - name: Pull published image
        run: |
          docker pull \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

      - name: Verify published image
        run: |
          docker run -d --name practical9-ghcr-test \
            -p 5001:5000 \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/; then
              echo "Published GHCR image works"
              break
            fi
            sleep 2
          done

          curl --fail --show-error http://localhost:5001/

          curl --fail --show-error \
            -X POST http://localhost:5001/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":85,"internal_marks":80,"assignment_marks":90,"previous_score":75}'

      - name: Show Docker images and containers
        if: always()
        run: |
          docker images
          docker ps -a

      - name: Cleanup
        if: always()
        run: |
          docker rm -f practical9-test practical9-ghcr-test || true
