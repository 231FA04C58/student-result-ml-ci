
name: Practical 9 - Docker Image Versioning

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t student-result-ml:practical9 .

      - name: Test Docker image
        run: |
          docker run -d --name practical9-test \
            -p 5000:5000 student-result-ml:practical9

          for i in {1..15}; do
            if curl --fail http://localhost:5000/; then
              echo "Application is ready"
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:5000/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create commit-based image tag
        run: |
          docker tag student-result-ml:practical9 \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

      - name: Push versioned image to GHCR
        run: |
          docker push \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

      - name: Pull published image
        run: |
          docker pull \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

      - name: Verify published image
        run: |
          docker run -d --name practical9-ghcr-test \
            -p 5001:5000 \
            ghcr.io/231fa04c58/student-result-ml:sha-${GITHUB_SHA::7}

          for i in {1..15}; do
            if curl --fail http://localhost:5001/; then
              echo "Published GHCR image works"
              exit 0
            fi
            sleep 2
          done

          docker logs practical9-ghcr-test
          exit 1

      - name: Show Docker images and containers
        if: always()
        run: |
          docker images
          docker ps -a

      - name: Cleanup
        if: always()
        run: |
          docker rm -f practical9-test practical9-ghcr-test || true
