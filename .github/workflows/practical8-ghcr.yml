
name: Student Result ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t student-result-ml:1.0 .

      - name: Test Docker image
        run: |
          docker run -d \
            --name practical8-test \
            -p 5000:5000 \
            student-result-ml:1.0

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready"
              break
            fi
            sleep 2
          done

          curl --fail --show-error http://localhost:5000/

          curl --fail --show-error \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":85,"internal_marks":80,"assignment_marks":90,"previous_score":75}'

      - name: Tag tested image for GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag student-result-ml:1.0 ghcr.io/231fa04c58/student-result-ml:v1
          docker tag student-result-ml:1.0 ghcr.io/231fa04c58/student-result-ml:latest

      - name: Show tagged images
        run: docker images

      - name: Push v1 tag to GHCR
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/231fa04c58/student-result-ml:v1

      - name: Push latest tag to GHCR
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/231fa04c58/student-result-ml:latest

      - name: Remove local copies of the image
        if: github.event_name != 'pull_request'
        run: |
          docker rmi ghcr.io/231fa04c58/student-result-ml:v1 || true
          docker rmi ghcr.io/231fa04c58/student-result-ml:latest || true

      - name: Pull image from GHCR
        if: github.event_name != 'pull_request'
        run: docker pull ghcr.io/231fa04c58/student-result-ml:v1

      - name: Run container from GHCR image
        if: github.event_name != 'pull_request'
        run: |
          docker run -d \
            --name practical8-test-ghcr \
            -p 5001:5000 \
            ghcr.io/231fa04c58/student-result-ml:v1

      - name: Wait for GHCR container to become ready
        if: github.event_name != 'pull_request'
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5001/; then
              echo "GHCR container is ready"
              exit 0
            fi
            sleep 2
          done

          docker logs practical8-test-ghcr
          exit 1

      - name: Test prediction endpoint on GHCR image
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --show-error \
            -X POST http://localhost:5001/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":85,"internal_marks":80,"assignment_marks":90,"previous_score":75}'

      - name: Show running containers
        if: always()
        run: docker ps -a

      - name: Show container logs
        if: always()
        run: |
          docker logs practical8-test || true
          docker logs practical8-test-ghcr || true

      - name: Prepare release candidate
        if: success()
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf "Student Result Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\nDocker image build and prediction test: passed\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f practical8-test practical8-test-ghcr || true
