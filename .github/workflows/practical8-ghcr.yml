
name: Student Result ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t student-result-ml:1.0 .

      - name: Test Docker image
        run: |
          docker run -d --name practical8-test -p 5000:5000 student-result-ml:1.0

          for i in {1..15}; do
            if curl --fail http://localhost:5000/; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:5000/

      - name: Tag tested image for GHCR
        run: |
          docker tag student-result-ml:1.0 ghcr.io/231fa04c58/student-result-ml:v1
          docker tag student-result-ml:1.0 ghcr.io/231fa04c58/student-result-ml:latest

      - name: Show tagged images
        run: docker images

      - name: Push v1 tag to GHCR
        run: docker push ghcr.io/231fa04c58/student-result-ml:v1

      - name: Push latest tag to GHCR
        run: docker push ghcr.io/231fa04c58/student-result-ml:latest

      - name: Remove local copies of the image
        run: |
          docker rmi ghcr.io/231fa04c58/student-result-ml:v1
          docker rmi ghcr.io/231fa04c58/student-result-ml:latest

      - name: Pull image from GHCR
        run: docker pull ghcr.io/231fa04c58/student-result-ml:v1

      - name: Run container from GHCR image
        run: |
          docker run -d --name practical8-test-ghcr \
            -p 5000:5000 \
            ghcr.io/231fa04c58/student-result-ml:v1

      - name: Wait for GHCR container to become ready
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:5000/; then
              echo "GHCR container is ready"
              exit 0
            fi
            sleep 2
          done

          docker logs practical8-test-ghcr
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":85,"internal_marks":80,"assignment_marks":90,"previous_score":75}'

      - name: Show running container
        run: docker ps -a

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f practical8-test practical8-test-ghcr || true
