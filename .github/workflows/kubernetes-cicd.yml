
name: Practical 14 - Automated Kubernetes Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/231fa04c58/student-result-ml:${{ github.sha }}

  deploy:
    name: Deploy to Minikube
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Kubernetes Connection
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get deployment student-result-prediction

      - name: Update Kubernetes Image
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $image = "ghcr.io/231fa04c58/student-result-ml:$env:IMAGE_TAG"
          kubectl set image deployment/student-result-prediction student-result-api=$image

      - name: Wait for Deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/student-result-prediction --timeout=180s
          kubectl get pods
          kubectl get services
